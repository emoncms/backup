# Emoncms Export and Import scripts config file

## DEFAULT CONFIG ##

# These settings are used for both the export and import scripts.
# To export from one location and import into another
# Used by both PHP and Bash and comments are not ignored

# Change all capitalised placeholders to relevant locations

# user
user="USER"

backup_script_location="BACKUP_SCRIPT_LOCATION"

# Directory location of Emoncms
emoncms_location="EMONCMS_LOCATION"

# Destination location of exported backup .tar.gz - Must be writable
backup_location="BACKUP_LOCATION"

# location of phpfina phpfiwa and phptimeseries databases
database_path="DATABASE_PATH"

# Location of emonhub.conf - leave blank if backup not required
emonhub_config_path="EMONHUB_CONFIG_PATH"

# Location of specimen emonhub config
emonhub_specimen_config="EMONHUB_SPECIMEN_CONFIG"

# Location of compressed backup data to import .tar.gz
backup_source_path="BACKUP_SOURCE_PATH"

# --- Write efficient USB drive backup (drive-backup.sh) ---

# Whether backing up to an attached drive can be used at all.
#
# It runs as root: it reads every feed file, mounts drives, writes /etc/fstab
# and can format a disk. With "no", drive-backup.sh and drive-restore.sh refuse
# to do any of that, from the Emoncms interface and from a shell alike, and the
# interface shows how to turn it on. Only the read only listing of drives stays
# available.
#
# install.sh sets "yes" on a Raspberry Pi, where a USB backup drive is the
# normal case. On a virtual machine or a server set it to "yes" by hand if you
# want to back up to a second disk or a NAS share; otherwise leave it at "no",
# so that a feature you are not using cannot be reached.
drive_backup_enabled="no"

# Destination directory on the mounted USB drive. Leave blank to disable.
# Prepare it once with: ./drive-backup.sh --init
drive_backup_path=""

# Number of daily and weekly MYSQL dumps to retain on the USB drive.
# Weekly copies are hard links, so cost no extra space where supported.
drive_backup_retain_daily_sql="7"
drive_backup_retain_weekly_sql="4"

# Day of week to retain a weekly MYSQL dump, 1=Monday .. 7=Sunday
drive_backup_weekly_day="1"

# Refuse to run if less than this much space would be left free, in MB
drive_backup_min_free_mb="256"

# drive-backup.sh refuses to run if the destination is on the root filesystem,
# which normally means the drive is not mounted. Set to "yes" to override.
drive_backup_allow_same_filesystem="no"

# Whether to preserve unix ownership and permissions on the backup.
# "auto" drops them on filesystems that cannot store them (CIFS/SMB shares
# mounted with a fixed uid, and FAT/exFAT/NTFS), where asking rsync to preserve
# them produces an error for every file. drive-restore.sh sets ownership
# correctly on the way back in regardless. "yes" or "no" to force.
drive_backup_preserve_permissions="auto"

# Seconds to wait for a network share to respond before treating it as
# unavailable. Only used when the destination is NFS, SMB/CIFS or sshfs.
drive_backup_probe_seconds="20"
